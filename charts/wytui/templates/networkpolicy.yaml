{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wytui
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: wytui
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow PostgreSQL within namespace
  - to:
    - podSelector:
        matchLabels:
          app: wytui-postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow external HTTPS (for yt-dlp, external APIs)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wytui-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: wytui-postgresql
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow wytui app to connect
  - from:
    - podSelector:
        matchLabels:
          app: wytui
    ports:
    - protocol: TCP
      port: 5432
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
{{- end }}
{{- end }}
